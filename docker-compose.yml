# Each service injects its per-app .env via `env_file`. The PUBLIC_URL var there
# becomes the app's nginx `server_name` at container start (envsubst template),
# so assigning a domain is just editing the app's .env and `docker compose up`.
# Build-time values (VITE_*) come from the `args:` below, not from env_file.
services:
  types:
    build:
      context: .
      dockerfile: types/Dockerfile
    volumes:
      - types-volume:/app/types

  remote-components:
    build:
      context: .
      dockerfile: remote-components/Dockerfile
      args:
        - VITE_APP_NAME=${VITE_COMPONENTS_APP_NAME:-Components Library}
        - VITE_BASE_API_URL=${VITE_BASE_API_URL:-http://localhost:8080}
    env_file:
      - ./remote-components/.env
    environment:
      - NODE_ENV=production
    ports:
      - "3002:80"
    volumes:
      - types-volume:/app/types
    depends_on:
      - types
    networks:
      - micro-frontend-network

  remote-auth:
    build:
      context: .
      dockerfile: remote-auth/Dockerfile
      args:
        - VITE_APP_NAME=${VITE_AUTH_APP_NAME:-Auth Service}
        - VITE_BASE_API_URL=${VITE_BASE_API_URL:-http://localhost:8080}
    env_file:
      - ./remote-auth/.env
    environment:
      - NODE_ENV=production
    ports:
      - "3001:80"
    volumes:
      - types-volume:/app/types
    depends_on:
      - types
      - remote-components
    networks:
      - micro-frontend-network

  remote-vue:
    build:
      context: .
      dockerfile: remote-vue/Dockerfile
      args:
        - VITE_BASE_API_URL=${VITE_BASE_API_URL:-http://localhost:8080}
    env_file:
      - ./remote-vue/.env
    environment:
      - NODE_ENV=production
    ports:
      - "3003:80"
    volumes:
      - types-volume:/app/types
    depends_on:
      - types
    networks:
      - micro-frontend-network

  host-dashboard:
    build:
      context: .
      dockerfile: host-dashboard/Dockerfile
      args:
        - VITE_APP_NAME=${VITE_DASHBOARD_APP_NAME:-Micro Front-end}
        - VITE_BASE_API_URL=${VITE_BASE_API_URL:-http://localhost:8080}
        # Remote base URLs baked into the host bundle at build time. Sources
        # (highest to lowest): shell env, the ROOT .env, then these defaults.
        # Edit them in the root .env and rebuild the host when domains change.
        - VITE_REMOTE_COMPONENTS_URL=${VITE_REMOTE_COMPONENTS_URL:-http://localhost:3002}
        - VITE_REMOTE_AUTH_URL=${VITE_REMOTE_AUTH_URL:-http://localhost:3001}
        - VITE_REMOTE_VUE_URL=${VITE_REMOTE_VUE_URL:-http://localhost:3003}
    env_file:
      - ./host-dashboard/.env
    environment:
      - NODE_ENV=production
    ports:
      - "3000:80"
    volumes:
      - types-volume:/app/types
    depends_on:
      - types
      - remote-components
      - remote-auth
      - remote-vue
    networks:
      - micro-frontend-network

networks:
  micro-frontend-network:
    driver: bridge

volumes:
  types-volume:
    name: micro-frontend-types 
