server {
    listen 80;
    # PUBLIC_URL is substituted at container start (nginx envsubst template)
    # from the per-app `.env`, so the app can be served on any domain.
    server_name ${PUBLIC_URL};

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Debug logging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hashed build assets are content-hashed, but we always revalidate so a new
    # build is picked up immediately: the browser sends If-None-Match and gets a
    # 304 when unchanged or a 200 with the new bytes after a deploy. No long
    # cache (1y was too stale for new builds).
    location /assets/ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    # Service Worker
    location /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
        access_log off;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
} 
