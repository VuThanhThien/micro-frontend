server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Debug logging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # remoteEntry.js is the federation manifest: it MUST never be cached, or the
    # host keeps loading a stale remote bundle (e.g. missing new API on mount).
    location = /assets/remoteEntry.js {
        alias /usr/share/nginx/html/assets/remoteEntry.js;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript" always;
        try_files $uri =404;
    }

    # Hashed build assets (js/css/etc.) are immutable and safe to cache long-term.
    # No Content-Type override here — nginx's mime.types sets the right type per
    # file (a blanket "application/javascript" here breaks CSS for the remote).
    location /assets/ {
        expires 1y;
        alias /usr/share/nginx/html/assets/;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Allow-Headers "*";
            add_header Content-Length 0;
            return 204;
        }
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
} 
